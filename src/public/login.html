<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Prithon MDM Control Console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060911;
            --bg-surface: #0B111E;
            --bg-card: #10192C;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(0, 229, 255, 0.4);
            --cyan-primary: #00E5FF;
            --cyan-glow: rgba(0, 229, 255, 0.25);
            --emerald: #10B981;
            --red-alert: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(16, 185, 129, 0.04) 40%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.04);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(0, 229, 255, 0.3);
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--cyan-primary);
            stroke-width: 2;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 46px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0 16px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #00E5FF 0%, #00B4D8 100%);
            border: none;
            border-radius: 10px;
            color: #060911;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            align-items: center;
            gap: 8px;
        }

        .auth-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 20px;
        }

        .auth-link {
            color: var(--cyan-primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(6, 9, 17, 0.3);
            border-top-color: #060911;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <h1 class="brand-title">Sign In to Prithon</h1>
            <p class="brand-subtitle">Access your isolated device fleet console</p>
        </div>

        <div id="errorBanner" class="error-banner">
            <span id="errorMsg">Invalid credentials</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email *</label>
                <div class="input-wrapper">
                    <input class="form-input" type="email" id="email" required placeholder="e.g. admin@prithon.com" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <div class="input-wrapper">
                    <input class="form-input" type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <div id="btnSpinner" class="spinner"></div>
                <span id="btnText">Sign In with Email &amp; Password</span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="/signup" class="auth-link">Admin Registration</a>
        </div>
    </div>

    <script>
        // Clean any legacy localStorage tokens
        localStorage.removeItem('prithon_token');

        const errorBanner = document.getElementById('errorBanner');
        const errorMsg = document.getElementById('errorMsg');
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get('expired') === '1') {
            errorMsg.innerText = '⚠️ Your 2-minute session has expired. Please sign in again.';
            errorBanner.style.display = 'flex';
        } else {
            // Check active session via HttpOnly Cookie
            fetch('/api/auth/me', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.user) {
                        window.location.replace('/dashboard');
                    }
                })
                .catch(() => {});
        }

        const loginForm = document.getElementById('loginForm');
        const errorBanner = document.getElementById('errorBanner');
        const errorMsg = document.getElementById('errorMsg');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBanner.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnSubmit.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.innerText = 'Verifying credentials...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }

                btnText.innerText = 'Access Granted. Redirecting...';
                window.location.replace('/dashboard');
            } catch (err) {
                errorMsg.innerText = err.message || 'Login failed. Please check credentials.';
                errorBanner.style.display = 'flex';
                btnSubmit.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.innerText = 'Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
