<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shop Account | Prithon MDM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060911;
            --bg-surface: #0B111E;
            --bg-card: #10192C;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --cyan-primary: #00E5FF;
            --emerald: #10B981;
            --red-alert: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(16, 185, 129, 0.04) 40%, transparent 70%);
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.04);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(0, 229, 255, 0.3);
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--cyan-primary);
            stroke-width: 2;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0 14px;
            font-size: 13.5px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .badge-free {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--emerald);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #00E5FF 0%, #00B4D8 100%);
            border: none;
            border-radius: 10px;
            color: #060911;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 18px;
        }

        .auth-link {
            color: var(--cyan-primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(6, 9, 17, 0.3);
            border-top-color: #060911;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <h1 class="brand-title">Create Shop Account</h1>
            <p class="brand-subtitle">Get your isolated device management workspace</p>
        </div>

        <div style="text-align: center;">
            <span class="badge-free">🎁 20 Free Device Protection Credits Included</span>
        </div>

        <div id="errorBanner" class="error-banner">
            <span id="errorMsg">Registration failed</span>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label" for="shopName">Shop / Company Name *</label>
                <input class="form-input" type="text" id="shopName" required placeholder="e.g. Apex Mobile Care" autocomplete="organization">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="ownerName">Owner Name *</label>
                    <input class="form-input" type="text" id="ownerName" required placeholder="e.g. Rajesh Sharma" autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Mobile Number</label>
                    <input class="form-input" type="tel" id="phone" placeholder="9876543210" autocomplete="tel">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input class="form-input" type="email" id="email" required placeholder="rajesh@apexmobiles.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password (Minimum 6 characters) *</label>
                <input class="form-input" type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <div id="btnSpinner" class="spinner"></div>
                <span id="btnText">Create Account &amp; Access Dashboard</span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="/login" class="auth-link">Sign In</a>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const errorBanner = document.getElementById('errorBanner');
        const errorMsg = document.getElementById('errorMsg');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBanner.style.display = 'none';

            const shopName = document.getElementById('shopName').value.trim();
            const ownerName = document.getElementById('ownerName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (password.length < 6) {
                errorMsg.innerText = 'Password must be at least 6 characters.';
                errorBanner.style.display = 'flex';
                return;
            }

            btnSubmit.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.innerText = 'Creating Workspace...';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopName, ownerName, phone, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                // Store token and user details in localStorage
                localStorage.setItem('prithon_token', data.token);
                localStorage.setItem('prithon_user', JSON.stringify(data.user));

                btnText.innerText = 'Setting Up Fleet...';
                window.location.replace('/dashboard');
            } catch (err) {
                errorMsg.innerText = err.message || 'Signup failed. Please try again.';
                errorBanner.style.display = 'flex';
                btnSubmit.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.innerText = 'Create Account & Access Dashboard';
            }
        });
    </script>
</body>
</html>
