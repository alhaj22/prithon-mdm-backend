<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shop Account | Prithon MDM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060911;
            --bg-surface: #0B111E;
            --bg-card: #10192C;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --cyan-primary: #00E5FF;
            --emerald: #10B981;
            --red-alert: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(16, 185, 129, 0.04) 40%, transparent 70%);
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 580px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.04);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(0, 229, 255, 0.3);
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--cyan-primary);
            stroke-width: 2;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0 14px;
            font-size: 13.5px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .badge-free {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--emerald);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #00E5FF 0%, #00B4D8 100%);
            border: none;
            border-radius: 10px;
            color: #060911;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .success-banner {
            display: none;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .btn-otp {
            background: linear-gradient(135deg, #00E5FF 0%, #00B4D8 100%);
            color: #060911;
            border: none;
            border-radius: 10px;
            height: 44px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-otp:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .btn-otp:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            background: #1e293b;
            color: #94a3b8;
            transform: none;
            box-shadow: none;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 18px;
        }

        .auth-link {
            color: var(--cyan-primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(6, 9, 17, 0.3);
            border-top-color: #060911;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <h1 class="brand-title">Admin Registration</h1>
            <p class="brand-subtitle">Setup your enterprise mobile device management console</p>
        </div>

        <div style="text-align: center;">
            <span class="badge-free"><svg style="width:13px; height:13px; vertical-align:-2px; margin-right:4px; stroke:currentColor; fill:none; stroke-width:2;" viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>20 Free Device Protection Credits Included</span>
        </div>

        <div id="errorBanner" class="error-banner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="errorMsg">Registration failed</span>
        </div>

        <div id="successBanner" class="success-banner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span id="successMsg">OTP sent successfully</span>
        </div>

        <form id="signupForm">
            <!-- Row 1: User Name & Company -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="userName">User Name *</label>
                    <input class="form-input" type="text" id="userName" required placeholder="e.g. Alhaj Khan" autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="company">Company *</label>
                    <input class="form-input" type="text" id="company" required placeholder="e.g. Prithon Enterprise" autocomplete="organization">
                </div>
            </div>

            <!-- Row 2: Email & Phone No -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="email">Email *</label>
                    <input class="form-input" type="email" id="email" required placeholder="e.g. admin@prithon.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone No * (10 Digits)</label>
                    <input class="form-input" type="tel" id="phone" required placeholder="e.g. 9876543210" maxlength="10" autocomplete="tel">
                </div>
            </div>

            <!-- Row 3: Password & Confirm Password -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input class="form-input" type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password *</label>
                    <input class="form-input" type="password" id="confirmPassword" required minlength="6" placeholder="••••••••" autocomplete="new-password">
                </div>
            </div>

            <!-- Row 4: 6-Digit OTP Field with Send OTP Button -->
            <div class="form-group" style="background: rgba(0, 229, 255, 0.03); border: 1px dashed rgba(0, 229, 255, 0.2); border-radius: 12px; padding: 14px 16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                    <label class="form-label" for="otp" style="margin-bottom:0; color:var(--text-main); font-weight:600;">
                        SMS Verification Code (6-Digit OTP) *
                    </label>
                    <span id="otpBadge" style="display:none; font-size:11px; font-weight:700; color:var(--emerald); background:rgba(16, 185, 129, 0.15); padding:2px 8px; border-radius:10px;">
                        <svg style="width:14px; height:14px; vertical-align:-2px; margin-right:4px; stroke:currentColor; fill:none; stroke-width:2.5;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>OTP SENT
                    </span>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <div style="position:relative; flex:1;">
                        <input class="form-input" type="text" id="otp" required placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" style="letter-spacing: 5px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 16px; text-align: center; background: var(--bg-surface);">
                    </div>
                    <button type="button" id="btnSendOtp" class="btn-otp">
                        <div id="otpSpinner" class="spinner" style="width:14px; height:14px; border-width:2px;"></div>
                        <span id="otpBtnText">Send OTP</span>
                    </button>
                </div>
                <div style="font-size: 11.5px; color: var(--text-dim); margin-top: 6px;">
                    OTP will be sent via Pearl SMS to your entered 10-digit Phone No. Valid for 5 minutes.
                </div>
            </div>

            <!-- Row 5: City & Address -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="city">City *</label>
                    <input class="form-input" type="text" id="city" required placeholder="e.g. Mumbai" autocomplete="address-level2">
                </div>
                <div class="form-group">
                    <label class="form-label" for="address">Address *</label>
                    <input class="form-input" type="text" id="address" required placeholder="e.g. 102, Central Park, Link Road" autocomplete="street-address">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <div id="btnSpinner" class="spinner"></div>
                <span id="btnText">Verify OTP &amp; Create Admin Account</span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="/login" class="auth-link">Sign In</a>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const errorBanner = document.getElementById('errorBanner');
        const errorMsg = document.getElementById('errorMsg');
        const successBanner = document.getElementById('successBanner');
        const successMsg = document.getElementById('successMsg');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');

        const phoneInput = document.getElementById('phone');
        const otpInput = document.getElementById('otp');
        const btnSendOtp = document.getElementById('btnSendOtp');
        const otpSpinner = document.getElementById('otpSpinner');
        const otpBtnText = document.getElementById('otpBtnText');
        const otpBadge = document.getElementById('otpBadge');

        let otpCountdownTimer = null;

        function showError(msg) {
            successBanner.style.display = 'none';
            errorMsg.innerText = msg;
            errorBanner.style.display = 'flex';
        }

        function showSuccess(msg) {
            errorBanner.style.display = 'none';
            successMsg.innerText = msg;
            successBanner.style.display = 'flex';
        }

        function clearAlerts() {
            errorBanner.style.display = 'none';
            successBanner.style.display = 'none';
        }

        // Send OTP Handler
        btnSendOtp.addEventListener('click', async () => {
            clearAlerts();
            const phone = phoneInput.value.trim().replace(/\D/g, '');

            if (!phone || phone.length !== 10) {
                showError('Please enter a valid 10-digit mobile number before requesting OTP.');
                phoneInput.focus();
                return;
            }

            btnSendOtp.disabled = true;
            otpSpinner.style.display = 'block';
            otpBtnText.innerText = 'Sending...';

            try {
                const response = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send OTP.');
                }

                showSuccess(data.message || 'OTP sent successfully! Please check your SMS inbox.');
                otpBadge.style.display = 'inline-block';
                otpInput.focus();

                // Start 45s countdown timer
                let countdown = 45;
                otpSpinner.style.display = 'none';
                otpBtnText.innerText = `Resend (${countdown}s)`;

                clearInterval(otpCountdownTimer);
                otpCountdownTimer = setInterval(() => {
                    countdown--;
                    if (countdown <= 0) {
                        clearInterval(otpCountdownTimer);
                        btnSendOtp.disabled = false;
                        otpBtnText.innerText = 'Resend OTP';
                    } else {
                        otpBtnText.innerText = `Resend (${countdown}s)`;
                    }
                }, 1000);

            } catch (err) {
                showError(err.message || 'Failed to dispatch OTP via Pearl SMS.');
                btnSendOtp.disabled = false;
                otpSpinner.style.display = 'none';
                otpBtnText.innerText = 'Send OTP';
            }
        });

        // Registration Submit Handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();

            const userName = document.getElementById('userName').value.trim();
            const company = document.getElementById('company').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = phoneInput.value.trim().replace(/\D/g, '');
            const otp = otpInput.value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const city = document.getElementById('city').value.trim();
            const address = document.getElementById('address').value.trim();

            if (!userName || !company || !email || !phone || !city || !address) {
                showError('Please fill out all required fields.');
                return;
            }

            if (phone.length !== 10) {
                showError('Please provide a valid 10-digit mobile number.');
                phoneInput.focus();
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            if (password !== confirmPassword) {
                showError('Password and Confirm Password do not match.');
                return;
            }

            if (!otp || otp.length !== 6) {
                showError('Please enter the 6-digit OTP sent to your phone and click Verify.');
                otpInput.focus();
                return;
            }

            btnSubmit.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.innerText = 'Verifying OTP & Creating Admin...';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        userName,
                        company,
                        email,
                        phone,
                        otp,
                        password,
                        confirmPassword,
                        city,
                        address
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                // Clean any legacy localStorage tokens
                localStorage.removeItem('prithon_token');

                showSuccess('Registration verified! Redirecting to dashboard...');
                btnText.innerText = 'Redirecting to Dashboard...';
                setTimeout(() => {
                    window.location.replace('/dashboard');
                }, 800);
            } catch (err) {
                showError(err.message || 'Signup failed. Please verify your OTP and try again.');
                btnSubmit.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.innerText = 'Verify OTP & Create Admin Account';
            }
        });
    </script>
</body>
</html>
